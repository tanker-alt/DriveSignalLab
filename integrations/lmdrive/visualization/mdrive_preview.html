<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDrive 运行可视化</title>
<style>body{margin:0;background:#111827;color:#e5e7eb;font:16px system-ui}main{max-width:1200px;margin:24px auto;padding:0 20px}h1{font-size:25px}p{color:#a9b4c5}select,button{background:#253249;color:white;border:1px solid #52627b;border-radius:6px;padding:9px;margin:4px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#1e293b;padding:14px;border-radius:10px}img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#080e19}canvas{width:100%;height:300px;background:#0b1220;border-radius:8px}input{width:100%}.blue{color:#60a5fa}.orange{color:#fb923c}#status{color:#67e8f9}small{color:#a9b4c5}@media(max-width:650px){section{grid-template-columns:1fr}}</style>
<main><h1 id="heading">MDrive · 运行可视化</h1><p>相机画面、实际轨迹和灯色随运行更新，可回放。灯色来自评测日志，显示在这里不代表已作为额外消息输入模型。</p>
<select id="runs"><option value="">自动跟随最新运行</option></select><button id="live">实时跟随</button><button id="play">播放回放</button><span id="status">读取中</span>
<section><div class="card"><b class="blue">ego 0</b><img id="im0"><div id="c0">等待观测</div><p id="s0"></p></div><div class="card"><b class="orange">ego 1</b><img id="im1"><div id="c1">等待观测</div><p id="s1"></p></div></section>
<div class="card" style="margin-top:16px"><div id="lanes">等待车道计数</div><canvas id="map" width="1100" height="300"></canvas><input id="slider" type="range" min="0" max="0" value="0"><small id="time">等待运行</small><p>彩色粗线是两辆 ego 轨迹；灰色细线和白色圆点是背景车轨迹与当前位置。方块是 ego 起点。坐标来自 CARLA 世界坐标，背景网格不代表道路地图。</p></div></main>
<script>
let data=null,follow=true,playing=false,index=0;const $=id=>document.getElementById(id),colors=['#60a5fa','#fb923c'],T=f=>f?.signal?.camera_frame??f?.carla_frame??f?.frame??0;
function render(){if(!data)return;$('heading').textContent='MDrive · '+(data.model||'运行可视化');document.querySelectorAll('section .card').forEach((c,i)=>{c.hidden=i>0&&!data.egos[i]?.frames.length});const frames=data.egos.map(e=>e.frames),timeline=[...frames.flat().map(T),...(data.lane_states||[]).map(e=>e.carla_frame),...(data.signal_snapshots||[]).map(e=>e.carla_frame)],first=timeline.length?Math.min(...timeline):0,last=timeline.length?Math.max(...timeline):0;$('slider').min=first;$('slider').max=last;if(follow)index=last;index=Math.max(first,Math.min(index||first,last));$('slider').value=index;
data.egos.forEach((e,i)=>{const f=e.frames.filter(f=>T(f)<=index).slice(-1)[0];if(!f){$('im'+i).removeAttribute('src');$('c'+i).textContent='等待该车辆的观测';$('s'+i).textContent='';return}if($('im'+i).getAttribute('src')!==f.image)$('im'+i).src=f.image;$('c'+i).textContent=`帧 ${f.frame} · 油门 ${f.throttle.toFixed(2)} · 转向 ${f.steer.toFixed(2)} · 刹车 ${Number(f.brake).toFixed(2)}`+(e.score?` · 最终完成度 ${e.score.score_route.toFixed(0)}%`:'');const envelope=f.signal;const m=envelope&&envelope.camera_signal?{...envelope,...envelope.camera_signal}:null;$('s'+i).style.color=m?({Red:'#f87171',Yellow:'#fde047',Green:'#4ade80'}[m.actual_state]||'#a9b4c5'):'#a9b4c5';$('s'+i).textContent=m?`灯 ${m.traffic_light_id} · ${ {LEFT:'左转',RIGHT:'右转',STRAIGHT:'直行'}[m.movement]||m.movement} · ${m.actual_state} · 相位剩余 ${m.phase_remaining_s.toFixed(1)}s · 图像时刻 ${m.elapsed_s.toFixed(2)}s · 停止线距离 ${m.distance_to_stop_line_m.toFixed(1)}m · ${ {approach:'接近路口',inside:'路口内',departed:'已离开'}[m.route_stage]||m.route_stage}`:(envelope?'该相机帧的灯色尚未确认':'此运行未启用固定灯控');});
const clock=(data.signal_snapshots||[]).filter(e=>e.carla_frame<=index).slice(-1)[0];$('time').textContent=`${data.run||'尚无运行'} · 当前 ${clock?clock.elapsed_s.toFixed(1):'0.0'} 仿真秒 · ${follow?'实时跟随':'回放'}`;$('status').textContent=data.status?.status==='completed'?'评测完成':data.run?'运行中／等待结果':'等待启动';
const cameraFrame=index;const laneHistory=(data.lane_states||[]).filter(e=>e.carla_frame<=cameraFrame),backgroundPoints=laneHistory.flatMap(e=>e.background_vehicles||[]);const cvs=$('map'),ctx=cvs.getContext('2d'),w=cvs.width,h=cvs.height;ctx.clearRect(0,0,w,h);const all=frames.flat().concat((data.signals||[]).map(m=>m.stop_line),backgroundPoints);if(!all.length)return;const xs=all.map(f=>f.x),ys=all.map(f=>f.y),xmin=Math.min(...xs)-8,xmax=Math.max(...xs)+8,ymin=Math.min(...ys)-8,ymax=Math.max(...ys)+8,scale=Math.min((w-50)/(xmax-xmin),(h-50)/(ymax-ymin)),X=x=>w/2+(x-(xmin+xmax)/2)*scale,Y=y=>h/2-(y-(ymin+ymax)/2)*scale;
ctx.strokeStyle='#243248';ctx.fillStyle='#8190a7';ctx.font='12px system-ui';for(let x=Math.ceil(xmin/10)*10;x<xmax;x+=10){ctx.beginPath();ctx.moveTo(X(x),0);ctx.lineTo(X(x),h);ctx.stroke();ctx.fillText('x '+x,X(x)+3,h-5)}for(let y=Math.ceil(ymin/10)*10;y<ymax;y+=10){ctx.beginPath();ctx.moveTo(0,Y(y));ctx.lineTo(w,Y(y));ctx.stroke();ctx.fillText('y '+y,5,Y(y)-3)}
const sceneSignal=(data.signal_snapshots||[]).filter(e=>e.carla_frame<=cameraFrame).slice(-1)[0];(data.signals||[]).forEach(m=>{const fs=frames[m.ego_index]||[],f=fs.filter(f=>T(f)<=index).slice(-1)[0],state=sceneSignal?.actual_states?.[m.traffic_light_id]||f?.signal?.camera_signal?.actual_state;ctx.fillStyle=({Red:'#f87171',Yellow:'#fde047',Green:'#4ade80'}[state]||'#9ca3af');ctx.fillRect(X(m.stop_line.x)-6,Y(m.stop_line.y)-6,12,12);ctx.fillText('灯 '+m.traffic_light_id,X(m.stop_line.x)+10,Y(m.stop_line.y)+16)});const bgTracks=new Map();laneHistory.forEach(e=>(e.background_vehicles||[]).forEach(v=>{if(!bgTracks.has(v.actor_id))bgTracks.set(v.actor_id,[]);bgTracks.get(v.actor_id).push(v)}));const activeBg=new Set((laneHistory.slice(-1)[0]?.background_vehicles||[]).map(v=>v.actor_id));ctx.lineWidth=1.2;bgTracks.forEach((track,id)=>{ctx.strokeStyle='#94a3b8';ctx.beginPath();track.forEach((p,j)=>j?ctx.lineTo(X(p.x),Y(p.y)):ctx.moveTo(X(p.x),Y(p.y)));ctx.stroke();if(activeBg.has(id)){const p=track[track.length-1];ctx.fillStyle=p.movement===0?'#cbd5e1':'#f8fafc';ctx.beginPath();ctx.arc(X(p.x),Y(p.y),4,0,Math.PI*2);ctx.fill();ctx.fillText('bg '+p.demand_id,X(p.x)+6,Y(p.y)-5)}});frames.forEach((fs,i)=>{const shown=fs.filter(f=>T(f)<=index);if(!shown.length)return;ctx.strokeStyle=ctx.fillStyle=colors[i];ctx.lineWidth=3;ctx.beginPath();shown.forEach((f,j)=>j?ctx.lineTo(X(f.x),Y(f.y)):ctx.moveTo(X(f.x),Y(f.y)));ctx.stroke();ctx.fillRect(X(fs[0].x)-4,Y(fs[0].y)-4,8,8);const f=shown[shown.length-1];ctx.beginPath();ctx.arc(X(f.x),Y(f.y),7,0,Math.PI*2);ctx.fill();ctx.fillText('ego '+i,X(f.x)+12,Y(f.y)-8)});
const lane=(data.lane_states||[]).filter(e=>e.carla_frame<=cameraFrame).slice(-1)[0];$('lanes').textContent=lane?`灯控 ${lane.controller} · 进口车辆 [${lane.incoming.join(', ')}] · 出口车辆 [${lane.outgoing.join(', ')}] · 排队 [${lane.queued.join(', ')}] · 压力 [${lane.pressure.join(', ')}]`:'此运行没有车道计数';}
async function refresh(){try{const response=await fetch('/api?run='+encodeURIComponent($('runs').value));if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();const selected=$('runs').value;$('runs').replaceChildren(new Option('自动跟随最新运行',''),...data.runs.map(r=>new Option(r,r)));$('runs').value=selected;render()}catch(e){$('status').textContent='连接中断：'+e.message}}
$('runs').onchange=()=>{index=0;follow=true;playing=false;refresh()};$('slider').oninput=()=>{follow=false;playing=false;index=Number($('slider').value);render()};$('live').onclick=()=>{follow=true;playing=false;render()};$('play').onclick=()=>{follow=false;playing=!playing;if(index>=Number($('slider').max))index=Number($('slider').min);$('play').textContent=playing?'暂停回放':'播放回放';render()};setInterval(()=>{if(playing){index+=Math.max(1,Math.round(.5/(data.frame_seconds||.05)));if(index>=Number($('slider').max)){playing=false;$('play').textContent='播放回放'}render()}},500);setInterval(refresh,1000);refresh();
</script></html>
